<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>A version — Recipe versions mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../recipe/recipe.css"><link rel="stylesheet" href="versions.css">
<script src="../theme.js"></script><script src="../recipe/recipe.js"></script><script src="versions.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
(function(){
var X=RCP,V=VER,ic=X.ic,esc=X.esc,F=V.FAM;
var v=V.byId(X.Q.get("v")||F.usual)||V.byId(F.usual);
/* L5 (locked): every household member has the same controls. No follower view. */
var ph=document.getElementById("ph");
/* Owner's answer 5 (locked): the star is your own "liked" on this version; everyone has their own. */
var star=(V.REACT[v.id]||{})[V.ME]==="liked";
function band(){
  /* V-D4: the state says itself in one slim band, with the one action that moves it on. Kept needs no band unless it is the usual. */
  var h=V.head(v);
  if(v.state==="trying")return '<div class="band">'+ic("flame","s")+'<span class="t"><b>Trying</b> since '+v.when+' · cooked '+v.cooked+'×<small>Changes save straight into it. Revision '+h.n+'.</small></span>'+'<button type="button" class="btn sm" data-keep>Keep it</button>'+'</div>';
  if(v.state==="put_away")return '<div class="band mut">'+ic("x","s")+'<span class="t"><b>Put away</b><small>'+esc(v.awayWhy||"Hidden from lists, plans and ideas.")+'</small></span><button type="button" class="btn sm ghost" data-back>Bring back</button></div>';
  if(v.state==="spun")return '<div class="band mut">'+ic("branch","s")+'<span class="t"><b>Spun off</b><small>Now its own recipe: '+esc(v.spunTo)+'. Its versions live there.</small></span><a class="btn sm ghost" href="#" data-spunopen>Open</a></div>';
  return '';
}
function reactLine(){
  /* Owner's answer 5 (locked): each member's own reaction; the household line is derived from them, never voted. */
  var L=V.liked(v.id),mine=(V.REACT[v.id]||{})[V.ME];if(!L.ate&&v.state==="suggested")return "";
  return '<div class="react"><p>'+(V.likedLine(v.id)||'Nobody has cooked it yet')+'</p>'+
    '<div class="rb" role="group" aria-label="Your reaction"><button type="button" class="mini" data-react="liked" aria-pressed="'+(mine==="liked")+'">😋 I liked it</button><button type="button" class="mini" data-react="no" aria-pressed="'+(mine==="no")+'">🙅 Not for me</button></div></div>';
}
function notesSec(){
  /* A note shows on the version it was written on and every version made from it. One written higher up says where from
     ("From Original"); one this version reworded says so; a hidden one is folded into one line. */
  var ns=V.notesFor(v.id),vis=ns.filter(function(n){return !n.hidden}),hid=ns.filter(function(n){return n.hidden});
  var h='<section class="sec" id="not"><div class="lblrow"><span class="lbl">Notes · '+vis.length+'</span></div>'+
    vis.map(function(n){var from=n.origin!==v.id?V.byId(n.origin):null,re=n.at===v.id&&n.origin!==v.id;
      return '<div class="note vn" data-nid="'+n.id+'">'+(from?'<span class="nfrom">'+ic("branch","xs")+(re?'Reworded here, first written on ':'From ')+esc(from.name)+'</span>':'')+esc(n.t)+
        '<small>'+V.who(n.by)+' · '+n.when+(n.cook?' · after the '+n.cook+' cook':'')+'</small></div>'}).join("")+
    (hid.length?'<p class="nhid">'+ic("x","xs")+hid.length+' note'+(hid.length>1?'s':'')+' from '+esc(V.byId(hid[0].origin).name)+' hidden on this version · <button type="button" class="lnk" data-unhide>Show again</button></p>':'')+
    (vis.length?'':'<p class="nhid">No notes yet.</p>')+
    '<button type="button" class="back" data-note style="font-size:14px">'+ic("note","s")+' Add a note</button></section>';
  return h;
}
function noteSheet(){
  /* What "add a note" targets: the version in front of you (a change to its notes). "Every version" writes it at the top of
     the lineage so it reaches them all; offered when this is not already the top, and never across a spin-off. */
  var root=V.root(),kids=F.versions.filter(function(x){return x.state!=="spun"&&x.state!=="put_away"}).length;
  var top=v.id===root.id;
  X.sheet('<h3>Add a note</h3><p style="font-size:12.5px">Bold, lists and links work. Only what changed is stored.</p><textarea class="field nbox" rows="4" maxlength="4000" style="padding:8px;margin-top:8px" aria-label="Note"></textarea><p class="ncount" data-ncount hidden aria-live="polite"></p>'+
    '<div role="radiogroup" aria-label="Where the note goes">'+
    '<button type="button" class="ch" role="radio" data-nt="here" aria-pressed="true">'+ic("note")+'<span class="t"><b>'+esc(v.name)+(top?' and every version':'')+'</b><small>'+(top?'This is the first version, so all '+kids+' in use show it, and new ones made from it':'Shows here and on versions made from '+esc(v.name)+' later')+'.</small></span><span class="rad" aria-hidden="true"></span></button>'+
    (top||v.state==="spun"?'':'<button type="button" class="ch" role="radio" data-nt="all" aria-pressed="false">'+ic("branch")+'<span class="t"><b>Every version of '+esc(F.name)+'</b><small>Written on '+esc(root.name)+', so all '+kids+' versions in use show it. Not the spun-off recipe.</small></span><span class="rad" aria-hidden="true"></span></button>')+
    '</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-close>Cancel</button><button class="btn" data-nsave>Save note</button></div>',
  function(s,close){X.noteCap(s.querySelector("textarea"),s.querySelector("[data-ncount]"));s.addEventListener("click",function(e){var c=e.target.closest("[data-nt]");if(c){s.querySelectorAll("[data-nt]").forEach(function(b){b.setAttribute("aria-pressed",b===c)})}
    if(e.target.closest("[data-nsave]")){var all=s.querySelector('[data-nt=all][aria-pressed=true]'),t=s.querySelector("textarea").value||"Sample note.";
      var on=all?root.id:v.id,id="n"+Date.now();(V.NOTES[on]=V.NOTES[on]||[]).push({op:"add",id:id,t:t,by:V.ME,when:"just now"});close();draw(1);
      X.toast(all?"Saved on every version":"Saved on "+v.name,function(){V.NOTES[on]=V.NOTES[on].filter(function(o){return o.id!==id});draw(1)})}})});
}
function hideSheet(nid){
  var n=V.notesFor(v.id).filter(function(x){return x.id===nid})[0],from=V.byId(n.origin);
  X.sheet('<h3>This note</h3><p style="font-size:13px">'+esc(n.t)+'</p>'+(n.origin!==v.id?'<p style="font-size:12.5px;margin-top:6px">Written on '+esc(from.name)+'. Hiding it here hides it on '+esc(v.name)+' and versions made from it; '+esc(from.name)+' keeps it.</p>':'')+
    '<div style="display:grid;gap:8px;margin-top:12px">'+(n.origin!==v.id?'<button class="btn ghost" data-nh>'+ic("x","s")+'Hide on '+esc(v.name)+'</button>':'<button class="btn ghost" data-nh>'+ic("x","s")+'Remove (undo any time)</button>')+'<button class="btn ghost" data-close>Close</button></div>',
  function(s,close){var b=s.querySelector("[data-nh]");b.onclick=function(){var op={op:"hide",id:nid,by:V.ME,when:"just now"};(V.NOTES[v.id]=V.NOTES[v.id]||[]).push(op);close();draw(1);X.toast("Hidden. Undo here or in History any time.",function(){V.NOTES[v.id].splice(V.NOTES[v.id].indexOf(op),1);draw(1)})}});
}
function draw(keep){
  var y=keep&&document.getElementById("body")?document.getElementById("body").scrollTop:0;
  var c=V.CONTENT[v.id],p=v.parent?V.byId(v.parent):null,h=V.head(v);
  /* L3 (locked): no chip. Several versions = the strip (its own row, docked above the jump row); one version = no row at all. */
  var strip=V.strip(v.id);
  var meta='<div class="meta"><span class="mc ro">'+ic("clock")+'20 min</span></div>';
  var line='<p style="font-size:12.5px;margin-top:6px">'+(p?'From <a href="version.html?v='+p.id+'" style="color:var(--accent);font-weight:700">'+esc(p.name)+'</a> · ':'')+'Made by '+V.who(v.by)+(V.isAI(v.by)?' for '+V.who(V.WHO[v.by][2]):'')+', '+v.when+' · <a data-key="," href="history.html?v='+v.id+'" style="color:var(--accent);font-weight:700">'+h.n+' revision'+(h.n>1?'s':'')+'</a></p>';
  /* V-D12: a child is pinned to the parent revision it was made from. A later fix to the parent is offered once, never applied silently. */
  var pf=p&&v.state!=="put_away"&&v.state!=="spun"?p.revs.filter(function(r){return r.kind==="fix"&&r.when==="21 Sep"&&v.id==="v1"})[0]:null;
  var pfix=pf&&!window._pfDone?'<div class="slim"><span class="e" aria-hidden="true">↧</span><span class="t"><b>'+esc(p.name)+' was fixed on '+pf.when+'</b><small>Step 4 now says cold rice. Yours still says the rice.</small></span><button type="button" class="mini" data-pf>Bring it in</button></div>':'';
  /* Pick 4 B (locked): the assistant already saved into this kept version. It is live now; one slim line says so until any member reviews it. */
  var rv=V.open(v.id)[0];
  var rvl=rv?'<a class="slim" style="border-color:var(--danger)" href="suggestions.html?r='+rv.id+'"><span class="e" aria-hidden="true">✦</span><span class="t"><b>'+V.who(rv.by)+' changed this '+rv.when+'</b><small>'+esc(rv.title)+' · in use now · '+rv.changes.filter(function(x){return !x.st}).length+' change'+(rv.changes.length>1?'s':'')+' to review</small></span>'+ic("chev","s")+'</a>':'';
  var mark=function(){return ' <span class="rvm">'+ic("spark","xs")+'to review</span>'};
  var ings=c.ings.map(function(i){var ch=c.chg[i[0]],r=rv&&c.rv&&c.rv.ing===i[0];return '<div class="ing'+(ch?' chg':'')+'"><span class="dot" aria-hidden="true"></span><span class="nm">'+esc(i[0])+'<span class="q">'+esc(i[1])+'</span>'+(ch&&ch!=="added"?' <span class="was">(<s>'+esc(ch)+'</s>)</span>':'')+(ch==="added"?' <span class="was">added</span>':'')+(r?mark():'')+'</span></div>'}).join("");
  var st=c.steps.map(function(s,k){var r=rv&&c.rv&&c.rv.step===k;return '<div class="stp'+(r?' ing chg':'')+'"><span class="nb">'+(k+1)+'</span><div style="flex:1"><p>'+esc(s)+(r?mark():'')+'</p></div></div>'}).join("");
  var jumps='<nav class="jumps" aria-label="Sections"><a href="#ing" class="on">Ingredients</a><a href="#met">Method</a><a href="#not">Notes</a></nav>';
  ph.innerHTML='<div class="top"><a class="back" href="family.html?v='+v.id+'">'+ic("back","s")+'Versions</a><span class="ttl"></span>'+
    '<button type="button" class="ib bare" data-star aria-pressed="'+star+'" aria-label="'+(star?"Starred by you":"Star")+'">'+(star?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="fill:var(--accent);stroke:var(--accent)"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>':ic("star"))+'</button>'+
    '<button type="button" class="ib bare" data-more aria-label="More" aria-haspopup="dialog">'+ic("dots")+'</button></div>'+
    '<div class="body'+(strip?' has-vers':'')+'" id="body">'+band()+rvl+pfix+
    '<div class="pad"><div style="display:flex;gap:8px;align-items:flex-start"><span style="font-size:34px;line-height:1" aria-hidden="true">'+F.e+'</span><h1 style="flex:1">'+esc(F.name)+'</h1></div>'+
    '<div class="pills" style="margin-top:6px">'+(F.usual===v.id?V.usual:'')+V.pill(v.state)+V.rvBadge(v.id)+'<span class="tg mut">'+esc(v.name)+'</span></div>'+meta+line+reactLine()+'</div>'+
    strip+jumps+
    '<section class="sec" id="ing"><div class="lblrow"><span class="lbl">Ingredients · serves 2</span></div>'+ings+'</section>'+
    '<section class="sec" id="met"><div class="lblrow"><span class="lbl">Method</span></div>'+st+'</section>'+
    /* Owner's answer 2 (locked, typed, 10 Oct 2026): notes are a field of the version, inherited down the lineage and stored
       only where a version's notes differ (spec 9.4). The app writes notes and photos, never recipe content (L4). */
    notesSec()+'<div style="height:24px"></div></div>'+
    '<div class="act">'+(v.state==="spun"?'':'<a class="btn ghost" data-key="e" href="../recipe/edit.html?id=efr&v='+v.id+'">'+ic("pen","s")+'Edit</a>')+
    (v.state==="put_away"||v.state==="spun"?'':'<a class="btn" href="after-cook.html?v='+v.id+'">'+ic("flame","s")+'Cook it</a>')+'</div>';
  var b=document.getElementById("body");b.scrollTop=y;
  var vs=document.getElementById("vstrip"),jr=b.querySelector(".jumps"),vh=vs?vs.offsetHeight:0;
  if(vs){var on=vs.querySelector("[aria-current=true]");if(on)vs.scrollLeft=Math.max(0,on.offsetLeft-vs.clientWidth/2+on.offsetWidth/2)}
  var onS=function(){var cur="ing";["ing","met","not"].forEach(function(k){var el=document.getElementById(k);if(el&&el.offsetTop-vh-jr.offsetHeight-4<=b.scrollTop)cur=k});
    jr.querySelectorAll("a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+cur)});
    jr.classList.toggle("docked",jr.getBoundingClientRect().top-b.getBoundingClientRect().top<=vh+1)};
  b.addEventListener("scroll",onS);onS();
  jr.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();var el=document.getElementById(a.getAttribute("href").slice(1));if(el)b.scrollTop=el.offsetTop-vh-jr.offsetHeight})});
}
ph.addEventListener("click",function(e){
  var nn=e.target.closest(".note.vn");if(nn&&!e.target.closest("button,a")){hideSheet(nn.dataset.nid);return}
  var t=e.target.closest("button,a");if(!t)return;
  if(t.hasAttribute("data-star")){var r=V.REACT[v.id]=V.REACT[v.id]||{};star=!star;if(star)r[V.ME]="liked";else delete r[V.ME];draw(1);X.toast(star?"Liked, by you. Others keep their own.":"Your like is cleared")}
  else if(t.hasAttribute("data-keep")){e.preventDefault();keepSheet()}
  else if(t.hasAttribute("data-back")){v.state="kept";draw();X.toast("Back as Kept. It shows in lists again.",function(){v.state="put_away";draw()})}
  else if(t.hasAttribute("data-spunopen")){e.preventDefault();X.toast("Opens Kimchi fried rice (sample stops here)")}
  else if(t.hasAttribute("data-more"))more();
  else if(t.hasAttribute("data-note"))noteSheet();
  else if(t.hasAttribute("data-unhide")){var hs=(V.NOTES[v.id]||[]).filter(function(o){return o.op==="hide"});var keep=hs.slice();V.NOTES[v.id]=(V.NOTES[v.id]||[]).filter(function(o){return o.op!=="hide"});draw(1);X.toast("Shown again (saved as a new change)",function(){V.NOTES[v.id]=V.NOTES[v.id].concat(keep);draw(1)})}
  else if(t.hasAttribute("data-react")){var r=V.REACT[v.id]=V.REACT[v.id]||{},was=r[V.ME];if(r[V.ME]===t.dataset.react)delete r[V.ME];else r[V.ME]=t.dataset.react;star=r[V.ME]==="liked";draw(1);X.toast(r[V.ME]?(r[V.ME]==="liked"?"Liked, by you. The household sees who liked it.":"Not for you. Only your own answer changed."):"Your answer is cleared",function(){if(was)r[V.ME]=was;else delete r[V.ME];star=r[V.ME]==="liked";draw(1)})}
  else if(t.hasAttribute("data-pf")){X.sheet('<h3>Bring the fix into '+esc(v.name)+'?</h3><p style="font-size:13px">Original changed step 4 to say cold rice. '+esc(v.name)+' was made before that, so it still says "the rice". Bringing it in saves revision '+(V.head(v).n+1)+' of '+esc(v.name)+'.</p>'+V.diff([["chg","Step 4: Tip in the cold rice and the peas…","Tip in the rice and the peas…"]])+'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-close data-pfno>Leave it</button><button class="btn" data-close data-pfok>Bring it in</button></div>',function(s){s.addEventListener("click",function(e){if(e.target.closest("[data-pfok],[data-pfno]")){window._pfDone=1;setTimeout(draw,0);if(e.target.closest("[data-pfok]"))X.toast("Saved as revision "+(V.head(v).n+1))}})})}
});
function keepSheet(){
  X.sheet('<h3>Keep '+esc(v.name)+'?</h3><p style="font-size:13px">It stops being a try. Changes after this ask first: fix it, or save a new version.</p>'+
    '<button type="button" class="ch" data-u aria-pressed="false">'+ic("star")+'<span class="t"><b>Also make it our usual</b><small>Plan, Cook and Ideas open this one instead of '+esc(V.byId(F.usual).name)+'.</small></span><span class="rad" aria-hidden="true"></span></button>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" data-close>Not yet</button><button class="btn" data-ok>Keep it</button></div>',
  function(s,close){var u=s.querySelector("[data-u]");u.onclick=function(){u.setAttribute("aria-pressed",u.getAttribute("aria-pressed")!=="true")};
    s.querySelector("[data-ok]").onclick=function(){var was=F.usual,mk=u.getAttribute("aria-pressed")==="true";v.state="kept";if(mk)F.usual=v.id;close();draw();X.toast("Kept"+(mk?" and made our usual":""),function(){v.state="trying";F.usual=was;draw()})}});
}
function more(){
  /* V-D9: every lifecycle action lives in one sheet, in the order people reach for them. Only the ones that apply show. */
  var o=[];
  if(F.usual!==v.id&&v.state!=="put_away"&&v.state!=="spun")o.push(['data-usual',"star","Make it our usual","Plan, Cook and Ideas open this one for everyone"]);
  if(v.state!=="spun")o.push(['href="change.html?v='+v.id+'&step=chat"',"spark","Change it with your assistant","Say it in your own words. Edits by hand and by the assistant share one History"]);
  if(v.state!=="spun")o.push(['href="change.html?v='+v.id+'&new=1"',"branch","New version from this","Starts as Trying, with this one as its parent"]);
  if(v.state!=="spun")o.push(['data-spin',"spark","Make it its own recipe","For when it is a different dish now. The link back stays"]);
  o.push(['href="history.html?v='+v.id+'"',"undo","History","Every saved change, who made it, and going back"]);
  if(F.usual!==v.id)o.push(['href="history.html?v='+v.id+'&cmp='+F.usual+'"',"note","Compare with our usual","Side by side, only what differs"]);
  if(v.state==="trying")o.push(['data-keep',"check","Keep it","Stops being a try"]);
  if(v.state==="kept"&&F.usual!==v.id)o.push(['data-totry',"flame","Back to trying","Changes save straight into it again"]);
  if(v.state!=="put_away"&&v.state!=="spun")o.push(['data-away',"x",F.usual===v.id?"Put away (pick a new usual first)":"Put away","Hidden from lists, plans and ideas. Nothing is deleted. No approval needed (L8)"]);
  X.sheet('<h3>'+esc(v.name)+'</h3>'+o.map(function(x){var isA=/^href/.test(x[0]);return (isA?'<a class="opt" '+x[0]+'>':'<button type="button" class="opt" '+x[0]+(F.usual===v.id&&x[0]==="data-away"?' disabled style="opacity:.5"':'')+'>')+ic(x[1])+'<span class="t"><b>'+x[2]+'</b><small>'+x[3]+'</small></span>'+(isA?'</a>':'</button>')}).join(""),
  function(s,close){s.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-usual")){var was=F.usual;F.usual=v.id;if(v.state==="trying")v.state="kept";close();draw();X.toast("Our usual is now "+v.name,function(){F.usual=was;draw()})}
    else if(b.hasAttribute("data-keep")){close();keepSheet()}
    else if(b.hasAttribute("data-totry")){v.state="trying";close();draw();X.toast("Back to trying")}
    else if(b.hasAttribute("data-away")){var ws=v.state;v.state="put_away";v.awayWhy="Put away just now by "+X.me[2]+". Bring back undoes it, any time.";close();draw();X.toast("Put away. Undo now, or Bring back any time.",function(){v.state=ws;draw()})}
    else if(b.hasAttribute("data-spin")){close();X.sheet('<h3>Make it its own recipe</h3><p style="font-size:13px">'+esc(v.name)+' becomes a new recipe in the list, starting as Trying. This family keeps a "Spun off" row that points to it, and the new one shows "From '+esc(F.name)+'".</p><label class="lbl" for="sn" style="display:block;margin-top:12px">New recipe name</label><input id="sn" class="field" style="margin-top:4px" value="'+esc(v.name)+'"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-close>Back</button><button class="btn" data-close>Make it</button></div>')}
  })});
}
draw();
V.controls();
})();
</script>
</body></html>
