<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Versions of a recipe — Recipe versions mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../recipe/recipe.css"><link rel="stylesheet" href="versions.css">
<script src="../theme.js"></script><script src="../recipe/recipe.js"></script><script src="versions.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
(function(){
var X=RCP,V=VER,ic=X.ic,esc=X.esc,F=V.FAM;
var showAway=false;
var ph=document.getElementById("ph");
var cur=X.Q.get("v");
/* Pick 1 A (locked): grouped by state. Option 1 B (family tree) not chosen; lineage stays as one line on each row.
   Opened from the strip's last item "All versions" (L3) and from the version's ⋯ sheet. L5: same controls for every member. */
function row(v){
  var h=V.head(v),p=v.parent?V.byId(v.parent):null;
  /* V-D7: a row says what it is called, how it stands (usual, state, to review), what changed from its parent, who and when. */
  var what=v.state==="spun"?'Now its own recipe: '+esc(v.spunTo):(p?'From '+esc(p.name)+': '+esc(v.revs[0].d.map(function(d){return d[1]}).join(", ")):'The first one');
  return '<a class="vr'+(v.id===cur?' on':'')+(v.state==="put_away"||v.state==="spun"?' away':'')+'" href="version.html?v='+v.id+'">'+V.av(v.by)+
    '<span class="t"><b>'+esc(v.name)+'</b><small>'+what+'</small><small>'+V.who(v.by)+', '+v.when+' · cooked '+v.cooked+'× · rev '+h.n+(V.isAI(h.by)?' by '+V.who(h.by):'')+'</small>'+
    '<span class="pills">'+(F.usual===v.id?V.usual:'')+V.pill(v.state)+V.rvBadge(v.id)+'</span>'+
    /* Owner's answer 5 (locked): who liked it, derived from each member's own reaction; never a household vote. */
    (V.liked(v.id).ate?'<small class="react"><span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+V.likedLine(v.id)+'</span></small>':'')+'</span>'+
    '<span class="chev">'+ic("chev","s")+'</span></a>';
}
function draw(){
  var vs=F.versions,act=vs.filter(function(v){return v.state!=="put_away"&&v.state!=="spun"}),off=vs.filter(function(v){return v.state==="put_away"||v.state==="spun"});
  var open=(F.reviews||[]).filter(function(r){return r.changes.some(function(c){return !c.st})});
  var rv=open.length?'<a class="slim" style="border-color:var(--danger)" href="suggestions.html"><span class="e" aria-hidden="true">✦</span><span class="t"><b>'+open.length+' assistant change'+(open.length>1?'s':'')+' to review</b><small>'+V.who(open[0].by)+' changed '+esc(V.byId(open[0].target).name)+', '+open[0].when+'. In use already.</small></span>'+ic("chev","s")+'</a>':'';
  var usual=V.byId(F.usual);
  var g=function(lbl,list){return list.length?'<div class="grp"><span class="lbl">'+lbl+'</span></div>'+list.map(row).join(""):''};
  var body=g("Our usual",[usual])+
      g("Trying",act.filter(function(v){return v.state==="trying"&&v.id!==F.usual}))+
      g("Kept",act.filter(function(v){return v.state==="kept"&&v.id!==F.usual}))+
      (off.length?'<div class="grp"><span class="lbl">Put away and spun off · '+off.length+'</span><button type="button" data-away aria-expanded="'+showAway+'">'+(showAway?"Hide":"Show")+'</button></div>'+(showAway?off.map(row).join(""):''):'');
  ph.innerHTML='<div class="top"><a class="back" href="version.html?v='+(cur||F.usual)+'">'+ic("back","s")+'Recipe</a><span class="ttl">'+esc(F.name)+'</span><span style="width:44px"></span></div>'+
    '<div class="body">'+rv+'<div class="pad" style="padding-bottom:0"><p style="font-size:13px">'+act.length+' versions in use. <b style="color:var(--fg)">Our usual</b> is what Plan, Cook and Ideas open. Tap one to see it.</p></div>'+
    '<div style="padding:0 var(--sp-3)">'+body+'</div><div style="height:24px"></div></div>'+
    /* L4 (locked): a new version's content comes through the assistant. The button hands off to the person's own AI app. */
    '<div class="act"><a class="btn ghost" href="history.html?v='+F.usual+'&cmp=v2">'+ic("note","s")+'Compare</a><button type="button" class="btn" data-ask>'+ic("spark","s")+'New version</button></div>';
}
ph.addEventListener("click",function(e){var t=e.target.closest("[data-away]");if(t){showAway=!showAway;draw()}
  if(e.target.closest("[data-ask]"))X.askAssistant("Egg fried rice: a new version");});
draw();
V.controls();
})();
</script>
</body></html>
