<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Shopper link with notes</title><link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="../shopper-link/kitchie.css"><link rel="stylesheet" href="../shopper-link/shopper.css"><link rel="stylesheet" href="notes.css"><script src="../../theme.js"></script></head><body data-no-theme-fab >
<main class="sl-page" data-sl-mode="swipe"><span class="brandbar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M6 10h12M9 6v1.5M9 13v3"></path></svg><span>Kitchie</span></span>
<form class="sl-form" onsubmit="return false"><svg class="sl-sprite" width="0" height="0" aria-hidden="true" focusable="false"><defs><symbol id="sl-i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h12l-3-3M19 15H7l3 3"/></symbol></defs></svg>
<section class="sl-view"><h1>Shopping list</h1>
<div class="sl-undo-bar" role="region" aria-label="Undo"><button type="button" class="sl-undo" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button><p class="sl-status"><b>4 to go</b><span>Swipe a line to answer it.</span></p></div>
<ul class="rows shop sl-list" id="shop">
<li class="shoprow" data-shop-row data-key="l0" data-name="Apples" data-state="open">
<div class="swrow"><div class="swfg"><label class="tick"><input type="checkbox" name="got" value="l0" id="sl-got-l0"><span aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg></span></label>
<label class="rlink" for="sl-got-l0"><span class="em" aria-hidden="true">🍎</span><span class="smain"><span class="sname"><span data-scribble>Apples</span> <b class="want">6</b></span><span class="inote">Crunchy: Pink Lady or Jazz. Not floury.</span></span></label></div></div>
<div class="sl-acts"><details class="sl-swap"><summary><svg width="18" height="18" aria-hidden="true" focusable="false"><use href="#sl-i-swap"/></svg><span>Got substitution?</span></summary>
<div class="sl-swap-f"><label class="sr-only" for="sl-swap-l0">What did you get instead of Apples?</label><input type="text" id="sl-swap-l0" maxlength="120" autocomplete="off" placeholder="What did you get instead?"><button type="button" class="btn sl-swap-ok">Done</button></div></details></div>
</li>
<li class="shoprow" data-shop-row data-key="l1" data-name="Cucumber" data-state="open">
<div class="swrow"><div class="swfg"><label class="tick"><input type="checkbox" name="got" value="l1" id="sl-got-l1"><span aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg></span></label>
<label class="rlink" for="sl-got-l1"><span class="em" aria-hidden="true">🥒</span><span class="smain"><span class="sname"><span data-scribble>Cucumber</span> <b class="want">2</b></span><span class="inote">Persian or Lebanese, the tasty kind</span></span></label></div></div>
<div class="sl-acts"><details class="sl-swap"><summary><svg width="18" height="18" aria-hidden="true" focusable="false"><use href="#sl-i-swap"/></svg><span>Got substitution?</span></summary>
<div class="sl-swap-f"><label class="sr-only" for="sl-swap-l1">What did you get instead of Cucumber?</label><input type="text" id="sl-swap-l1" maxlength="120" autocomplete="off" placeholder="What did you get instead?"><button type="button" class="btn sl-swap-ok">Done</button></div></details></div>
</li>
<li class="shoprow" data-shop-row data-key="l2" data-name="Milk" data-state="open">
<div class="swrow"><div class="swfg"><label class="tick"><input type="checkbox" name="got" value="l2" id="sl-got-l2"><span aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg></span></label>
<label class="rlink" for="sl-got-l2"><span class="em" aria-hidden="true">🥛</span><span class="smain"><span class="sname"><span data-scribble>Milk</span> <b class="want">2 l</b></span></span></label></div></div>
<div class="sl-acts"><details class="sl-swap"><summary><svg width="18" height="18" aria-hidden="true" focusable="false"><use href="#sl-i-swap"/></svg><span>Got substitution?</span></summary>

</li>
<li class="shoprow" data-shop-row data-key="l3" data-name="Sourdough" data-state="open">
<div class="swrow"><div class="swfg"><label class="tick"><input type="checkbox" name="got" value="l3" id="sl-got-l3"><span aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg></span></label>
<label class="rlink" for="sl-got-l3"><span class="em" aria-hidden="true">🍞</span><span class="smain"><span class="sname"><span data-scribble>Sourdough</span> <b class="want">1</b></span></span></label></div></div>
<div class="sl-acts"><details class="sl-swap"><summary><svg width="18" height="18" aria-hidden="true" focusable="false"><use href="#sl-i-swap"/></svg><span>Got substitution?</span></summary>
<div class="sl-swap-f"><label class="sr-only" for="sl-swap-l3">What did you get instead of Sourdough?</label><input type="text" id="sl-swap-l3" maxlength="120" autocomplete="off" placeholder="What did you get instead?"><button type="button" class="btn sl-swap-ok">Done</button></div></details></div>
</li>
</ul></section></form></main>
</body></html>
