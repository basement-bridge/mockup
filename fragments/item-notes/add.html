<div class="rlink"><span class="em" aria-hidden="true">🧈</span><div class="smain"><div class="sname"><span data-scribble>Butter</span> <b class="want">250 g</b></div><div class="shome">Fridge</div></div></div></div></div></li></ul><nav class="bar" aria-label="Main"><a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5h-3.5v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19.5z"/></svg><span>Home</span></a><a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="4" width="12" height="3.5" rx="1.5"/><path d="M7 7.5h10a2 2 0 0 1 2 2V18a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18V9.5a2 2 0 0 1 2-2z"/><circle cx="12" cy="14" r="2.2"/></svg><span>Pantry</span></a><a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 14a4 4 0 0 1-1-7.7 4.5 4.5 0 0 1 8.6-1.3 4 4 0 0 1 3.4 5.5A4 4 0 0 1 17 14v5H7z"/><path d="M7 17h10"/></svg><span>Recipes</span></a><a href="#" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 10.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6.2"/></svg><span>Shopping</span><i class="badge" aria-hidden="true">6</i></a></nav>
<div class="in-dim"></div>
<section class="in-sheet" aria-label="Add to list">
<div class="in-top"><span class="em" id="em">🥒</span><div style="flex:1"><b id="nm">Cucumber</b><span class="m">Add to list</span></div></div>
<button type="button" class="in-plus" id="plus" hidden>＋ Note</button>
<button type="button" class="in-note" id="line" aria-label="Edit note"><span class="tx" id="tx"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button>
<div class="in-ed" id="ed" hidden><input id="nt" maxlength="200" aria-label="Note" placeholder="Note"><button type="button" class="btn sec" id="rst" hidden>Pantry</button><button type="button" class="btn" id="ok">Done</button></div>
<span class="in-sync" id="sy"></span>
<div class="in-acts"><span class="btn">Cancel</span><span class="btn main">Add to list</span></div>
</section>
<script>
(function(){
var S={have:{em:"🥒",nm:"Cucumber",pantry:"Persian or Lebanese, the tasty kind",v:"Persian or Lebanese, the tasty kind"},trip:{em:"🍎",nm:"Apples",pantry:"Crunchy: Pink Lady or Jazz",v:"Crunchy: Pink Lady or Jazz. Not floury."},"new":{em:"🍞",nm:"Sourdough",pantry:"",v:""}};
var $=function(i){return document.getElementById(i)},cur="have",val="";
function view(){var s=S[cur],has=!!val.trim(),trip=has&&!!s.pantry&&val!==s.pantry;
 $("ed").hidden=true;$("plus").hidden=has;$("line").hidden=!has;$("tx").textContent=val;
 $("sy").hidden=!has;$("sy").className="in-sync"+(trip?" trip":"");$("sy").textContent=trip?"This trip":"Saved to Pantry"}
function edit(){$("ed").hidden=false;$("plus").hidden=true;$("line").hidden=true;$("sy").hidden=true;$("nt").value=val;$("rst").hidden=!(S[cur].pantry&&val!==S[cur].pantry);$("nt").focus()}
function set(k){if(!S[k])k="have";cur=k;var s=S[k];$("em").textContent=s.em;$("nm").textContent=s.nm;val=s.v;view()}
$("plus").onclick=edit;$("line").onclick=edit;
$("nt").oninput=function(){$("rst").hidden=!(S[cur].pantry&&this.value.trim()!==S[cur].pantry)};
$("nt").onkeydown=function(e){if(e.key==="Enter")$("ok").click()};
$("ok").onclick=function(){val=$("nt").value.trim();view()};
$("rst").onclick=function(){$("nt").value=S[cur].pantry;this.hidden=true};
window.addEventListener("hashchange",function(){set(location.hash.slice(1))});set(location.hash.slice(1));
})();
</script>
</body></html>
