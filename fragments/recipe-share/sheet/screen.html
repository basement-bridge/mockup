<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Share a recipe, create a link</title>
<!-- One screen, two layouts. ?o=a|b|c picks the option; ?s=default|created|copied|error|done pins a state (no timers); ?fail=1 makes the first Create fail.
     Under 1024px: phone.css + phone.js (bottom sheet). 1024px and up: desktop.css + desktop.js (flyout). The other pair is never fetched. -->
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../../recipe/recipe.css"><link rel="stylesheet" href="../../../recipe/keys.css"><link rel="stylesheet" href="share.css">
<link rel="stylesheet" href="phone.css" media="(max-width:1023.98px)"><link rel="stylesheet" href="desktop.css" media="(min-width:1024px)">
<script src="../../../theme.js"></script><script src="../../../recipe/recipe.js"></script><script src="share.js"></script><script src="page.js"></script></head>
<body data-no-theme-fab>
<div class="stage" id="stage"><div class="phone" id="ph"></div></div>
<div class="app" id="app" hidden></div>
<script>
(function(){
  var desk=matchMedia("(min-width:1024px)").matches;
  if(desk){document.getElementById("stage").remove();document.getElementById("app").hidden=false}else document.getElementById("app").remove();
  var s=document.createElement("script");s.src=desk?"desktop.js":"phone.js";document.body.appendChild(s);
})();
</script>
</body></html>
