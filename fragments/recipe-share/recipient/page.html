<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Shared recipe — recipient page</title>
<!-- What a person sees when they open a shared recipe link (mockup, 13 Oct 2026, updated 14 Oct). Public page, outside the app: no sign-in, same page if signed in.
     Params: s=anon|member|norecipes|expiring|expired|cancelled|loading|preview (default anon); inv=unclaimed|claimed|withdrawn|none (the invite on the link, default none; inv=1 is unclaimed);
     phase=text|steps|banner (freezes the loading state); bar=1 (show the invitation bar now); scroll=mid|end; ask=1 (open "ask for a new link").
     The only growth invitation is the bottom bar, shown after reading starts, when inv=unclaimed and the viewer is not signed in. Every other state is a clean recipe page.
     Loads: theme.css, theme.js, ../../../recipe-photos/photos.css (only the .pf photo frame), rs.css, rs.js; desktop.css only from 1024px up. Images are fetched by phase, not at parse time. -->
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../../recipe-photos/photos.css"><link rel="stylesheet" href="rs.css"><link rel="stylesheet" href="desktop.css" media="(min-width:1024px)">
<script src="../../../theme.js"></script>
</head><body data-no-theme-fab>
<div id="rs-root"></div>
<script src="rs.js"></script>
</body></html>
