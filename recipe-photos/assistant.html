<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Photo from the assistant — Recipe photos mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../recipe/recipe.css"><link rel="stylesheet" href="photos.css"><script src="../theme.js"></script><script src="../recipe/recipe.js"></script><script src="photos.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
/* How a photo the person gave their own AI app gets into Recipe (P-D12). The chat is a neutral stand-in, not any product's look:
   there is no in-app agent (plan-week-ai decision 42). One scene: the person shows the assistant tonight's dish. The assistant
   cannot carry the picture across; it asks Recipe for a one-time add link (request_photo_upload), and the person taps it:
   Kitchie's add screen opens already aimed at the right recipe and cook.
   Changed by owner decision L4, 10 Oct 2026: the second scene (a recipe from a web page with its photo, fetched by Recipe and shown
   on Check it) is removed. Recipe content comes only through the assistant's MCP tools; nothing reads, scrapes or fetches a link
   or a photo. The assistant still never sends picture bytes; it hands over a link and the person picks the photo. */
(function(){
var X=RCP,F=PHO,ic=X.ic,esc=X.esc;
var step=X.Q.get("step")||"chat";
var r=X.byId(X.Q.get("to")||"rag")||X.byId("rag");
var ph=document.getElementById("ph");
function draw(){
  var h;
  if(step!=="open"){
    h='<div class="chathead"><span class="dotai" aria-hidden="true">'+ic("spark","s")+'</span>Your assistant<span style="flex:1"></span><span class="lbl">your AI app</span></div>'+
      '<div class="body"><div class="mockmark">Stand-in for the person\'s own AI app</div><div class="chat">'+
      '<div class="bub me"><span class="att">'+F.frame("rag-1","t",{eager:1,alt:"Photo of tonight's ragù"})+'</span>Made the ragù tonight, 10 portions. Can you save the photo to it?</div>'+
      '<div class="bub">Looks great. I can\'t carry the picture across to Recipe myself, so here is a link that opens it ready to add: <b>Beef ragù, Cooked, today, by Priya</b>. It works once, for the next 15 minutes.'+
        '<a class="lnk2" href="?step=open&to=rag">'+ic("img","s")+'Add the photo in Kitchie</a>'+
        '<small>Recipe tool: request_photo_upload (recipe, kind: cooked). No picture data goes through the chat.</small></div>'+
      '<div class="bub">I\'ve also noted the cook: 10 portions, with your line "10 portions."<small>record_cook. The photo joins this cook when you add it.</small></div>'+
      '</div></div>';
  }else{
    /* Kitchie opens from the link: the target is already set; the person only picks the photo (the phone's picker), nothing else to choose. */
    h='<div class="top"><a class="back" href="recipe.html?id='+r.id+'">'+ic("back","s")+'Cancel</a><span class="ttl">Add a photo</span><span style="width:64px"></span></div>'+
      '<div class="body"><a class="slim acc" href="?step=chat"><span class="e" aria-hidden="true">'+ic("spark")+'</span><span class="t"><b>From your assistant</b><small>'+esc(r.name)+' · Cooked today · by Priya</small></span></a>'+
      '<div class="pad"><p style="font-size:14px;color:var(--fg)">Pick the photo you showed your assistant.</p></div>'+
      '<div class="pad" style="padding-top:0"><div class="pgal"><a href="done.html?to='+r.id+'&kind=cooked&p=rag-1&via=assistant" aria-label="The ragù photo">'+F.frame("rag-1","t",{alt:""})+'</a><button type="button" data-other aria-label="Another photo">'+F.frame("cur-1","t",{alt:""})+'</button><button type="button" data-other aria-label="Another photo">'+F.frame("sha-1","t",{alt:""})+'</button></div>'+
      '<p style="font-size:12px;margin-top:10px">Signed in as Priya. The link only works for your household, once.</p></div></div>';
  }
  ph.innerHTML=h;F.load(ph);
}
ph.addEventListener("click",function(e){var t=e.target.closest("[data-other]");if(t)X.toast("In the build any photo can be picked; the mockup only has the ragù one.")});
draw();
F.controls('<h4>Steps</h4><p><a href="?step=chat">1 The chat: a cooked photo shown to the assistant</a><br><a href="?step=open">2 The link opens Kitchie\'s add screen</a></p><p style="font-size:12px;margin-top:6px">The web-recipe scene was removed by owner decision L4 (10 Oct 2026): no link or photo is ever fetched or read.</p>');
})();
</script>
</body></html>
