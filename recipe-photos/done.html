<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Saved — Recipe photos mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../recipe/recipe.css"><link rel="stylesheet" href="photos.css"><script src="../theme.js"></script><script src="../recipe/recipe.js"></script><script src="photos.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
/* Saved confirmation for the add-photo and add-note flows (P-D25, P-D28). One screen, one way back, and the other UI job one tap away:
   after a photo, "Add a note"; after a note, "Add a photo". Coming from the end of a cook, Back returns to that end screen.
   Params: to, kind (cooked | dish | note), p (photo ids, comma separated), cook, from (cook | recipe), replace, where (household | cook). */
(function(){
var X=RCP,F=PHO,ic=X.ic,esc=X.esc;
var r=X.byId(X.Q.get("to")||"efr")||X.R[0];
var kind=(function(k){return k==="dish"||k==="cover"?"banner":k||"cooked"})(X.Q.get("kind"));
var raw=X.Q.get("phone")==="raw";
var ps=(X.Q.get("p")||(kind==="note"?"":"efr-c2")).split(",").filter(function(id){return F.META[id]});
var cook=X.Q.get("cook")||"tonight";
var from=X.Q.get("from")||"";
var replace=X.Q.get("replace");
var where=X.Q.get("where")||"household";
var v=r.vers.filter(function(x){return x.id===X.Q.get("v")})[0]||(r.vers.filter(function(x){return x.def})[0]||r.vers[0]);
var sn=+(X.Q.get("sn")||0);
/* Replace (P-D17 B as locked): the new photo is stored, the old one is removed with the 5-minute undo, then gone. */
if(replace&&F.META[replace])F.remove(replace);
/* back: carried from note.html (the flow slice's return url). Only same-site relative paths; otherwise the old returns. */
var backQ=X.Q.get("back")||"";
var safeBack=/^(\.\.\/recipe(-photos)?\/|recipe\.html)[\w.\-\/?=&%#~]*$/.test(backQ)?backQ:"";
var back=safeBack||(from==="cook"?"../recipe/cook.html?id="+r.id+"&step=99":"recipe.html?id="+r.id+(kind==="note"?"#not":kind==="cooked"?"#his":""));
var e,t,s,next;
if(kind==="note"){
  e="📝";t="Note saved";s=(where==="cook"?"On "+(cook==="tonight"?"tonight's":cook+"'s")+" cook, and under Notes.":"Under Notes on "+esc(v.name)+" and every version made from it.")+" Everyone in the household sees it.";
  next='<a class="btn ghost" href="'+F.addHref(r,{from:from,cook:cook==="tonight"?"":cook})+'">'+ic("cam","s")+'Add a photo</a>';
}else if(kind==="banner"||kind==="step"||kind==="more"){
  var what=kind==="banner"?"banner":kind==="step"?"photo for step "+(sn+1):"photo";
  e="📸";t=replace?"New "+what+" in":(kind==="banner"?"Banner saved":kind==="step"?"Step "+(sn+1)+" has its photo":"Photo saved");
  s="Everyone in the household sees it on "+esc(v.name)+"."+(replace?" The old one is removed: undo for 5 minutes, then it is gone for good.":"");
  next=replace?'<button type="button" class="btn ghost" data-undo>'+ic("undo","s")+'Undo (5 min)</button>':'';
}else{
  e="🍽️";t=ps.length>1?ps.length+" photos added to Cooked":"Added to Cooked";s=(cook==="tonight"?"Tonight":cook)+", with your name. Everyone in the household can see "+(ps.length>1?"them":"it")+", and nobody outside it.";
  next='<a class="btn ghost" href="'+F.noteHref(r,{from:from,cook:cook})+'">'+ic("note","s")+'Add a note</a>';
}
document.getElementById("ph").innerHTML='<div class="top"><span style="width:64px"></span><span class="ttl">Saved</span><span style="width:64px"></span></div>'+
  '<div class="body"><div class="saved" role="status"><div style="font-size:48px" aria-hidden="true">'+e+'</div><h2 style="margin-top:8px">'+t+'</h2><p style="margin-top:6px">'+s+'</p>'+
  (ps.length?'<div class="row">'+ps.map(function(id){return '<span class="pt">'+F.frame(id,"t",{prep:raw,small:1,alt:"Saved photo"})+'</span>'}).join("")+'</div>':'')+
  (kind==="cooked"&&ps.length&&!raw?'<div class="row mbs">'+ps.map(function(id){return '<button type="button" class="mini" data-mb="'+id+'" aria-pressed="false">'+ic("img","xs")+'Make banner</button>'}).join("")+'</div><p class="qnote" style="margin-top:8px">A cook photo is never the banner unless you choose it. A version has exactly one banner.</p>':'')+
  (raw?'<p class="qnote" style="margin-top:10px">'+ic("img","xs")+' Sent as it was. Recipe makes its sizes when the server is free; until then it shows as "Photo is being prepared".</p>':'')+
  '</div></div>'+
  '<div class="act">'+next+'<a class="btn" href="'+back+'">'+(from==="cook"?ic("back","s")+'Back to the cook':ic("back","s")+'Back to '+esc(r.name))+'</a></div>';
F.eager(document.getElementById("ph"));
document.getElementById("ph").addEventListener("click",function(e){var mb=e.target.closest("[data-mb]");if(mb){var prev=X.setBanner(r,v.id,mb.dataset.mb);document.querySelectorAll("[data-mb]").forEach(function(b){b.setAttribute("aria-pressed",String(b===mb));b.lastChild.textContent=b===mb?"Banner":"Make banner"});X.toast("This photo is now the banner of "+v.name+". The old one stays in Photos.",function(){X.setBanner(r,v.id,prev);document.querySelectorAll("[data-mb]").forEach(function(b){b.setAttribute("aria-pressed","false");b.lastChild.textContent="Make banner"})});return}if(e.target.closest("[data-undo]")&&replace){F.restore(replace);X.toast("The old one is back. The new one stays too; remove either from the recipe page.")}});
F.controls('<h4>Saved after</h4><p><a href="?to=efr&kind=cooked&p=efr-c2">One cooked photo</a> · <a href="?to=efr&kind=cooked&p=efr-c1,efr-c2,efr-c3&from=cook">Three, from the end of a cook</a> · <a href="?to=efr&kind=banner&p=efr-c2&replace=efr-1">Replaced banner (undo 5 min)</a> · <a href="?to=efr&kind=step&sn=2&p=efr-s2">Step photo</a> · <a href="?to=efr&kind=cooked&p=efr-c2&phone=raw">Sent unshrunk</a> · <a href="?to=efr&kind=note">A note on this version</a> · <a href="?to=efr&kind=note&v=v1&back=..%2Frecipe%2Fdetail.html%3Fid%3Defr%26v%3Dv1%23not">A note, back to the flow slice</a> · <a href="?to=efr&kind=note&where=cook&from=cook">A note on tonight\'s cook</a></p>');
})();
</script>
</body></html>
