<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Add a photo — Recipe photos mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../recipe/recipe.css"><link rel="stylesheet" href="photos.css"><script src="../theme.js"></script><script src="../recipe/recipe.js"></script><script src="photos.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
/* Add a photo (P-D11 as changed by owner decision L4, 10 Oct 2026, and P-D25). The UI's first job: "what you made tonight".
   Entry points, all one tap: the end of a cook (recipe/cook.html, ?from=cook), the Cooked row on the recipe page (?cook=<date>),
   the camera in the recipe page's top row and the Add tile in Photos. Each lands straight in the phone's own camera or picker,
   already aimed at a cook; there is no "what is it?" question and no sheet of doors in between.
   At most one question, and only when the target cook is not known from the entry: "Which cook?" (Tonight preselected).
   The cover of a version is the secondary path: a quiet link under the picker, and Replace cover in the viewer.
   Build: the entry is a <label> around a hidden <input type="file" accept="image/*" multiple> on the recipe page, so the phone's own
   picker (camera or library) opens on the first tap; the review screen and its shrinking code load only after a photo is picked (P-D14).
   Params: to (recipe), kind (cooked | dish), cook (the cook's date in the sample, its id in the build), from (cook | recipe),
   src (lib | cam), step, p (picked), replace (a cover being replaced). Any member, same controls (L5). */
(function(){
var X=RCP,F=PHO,ic=X.ic,esc=X.esc;
var r=X.byId(X.Q.get("to")||"efr")||X.R[0];
/* recipe/cook.html's end screen links here without ?from=cook; until the flow slice adds it, the referrer says so (mockup only:
   the build passes from=cook and the cook id explicitly). */
var from=X.Q.get("from")||(/\/recipe\/cook\.html/.test(document.referrer)?"cook":"");
var replace=X.Q.get("replace");
var kind=replace?"dish":(X.Q.get("kind")==="dish"?"dish":"cooked");
var cook=X.Q.get("cook")||(from==="cook"?"tonight":"");
var askCook=kind==="cooked"&&!cook; /* the one question, only when the entry did not say which cook */
if(!cook)cook="tonight";
var src=X.Q.get("src")||"lib";
var step=X.Q.get("step")||(src==="cam"?"edit":"pick");
var many={};(X.Q.get("p")||(src==="cam"?"efr-c2":"")).split(",").filter(Boolean).forEach(function(id){many[id]=1});
if(step!=="pick"&&!Object.keys(many).length)many["efr-c2"]=1;
var v=(r.vers.filter(function(x){return x.def})[0]||r.vers[0]);
var ph=document.getElementById("ph");
var me=X.me[2];
var cookLabel=function(c){return c==="tonight"?"Tonight":"Cooked "+c};
/* photos already on that cook count toward the 3 per cook (P-D8) */
var onCook=function(c){return c==="tonight"?0:F.photos(r).filter(function(p){return p.k==="cooked"&&p.when===c}).length};
var room=function(){return kind==="dish"?1:Math.max(0,3-onCook(cook))};
var backHref=from==="cook"?"../recipe/cook.html?id="+r.id+"&step=99":"recipe.html?id="+r.id;
var picked=function(){return Object.keys(many)};
function aim(){
  /* the target, said once at the top so nothing needs asking */
  return kind==="dish"?
    '<div class="aim">'+ic("img","s")+'<span><b>Cover of '+esc(v.name)+'</b><small>'+esc(r.name)+' · what the list and the top of the page show</small></span></div>':
    '<div class="aim">'+ic("cam","s")+'<span><b>'+(cook==="tonight"?"What you made tonight":"Your cook of "+esc(cook))+'</b><small>'+esc(r.name)+' · into Cooked, with your name ('+esc(me)+')</small></span></div>';
}
function draw(){
  var title=replace?"Replace the cover":kind==="dish"?"Add a cover":"Add a photo";
  var h='<div class="top"><a class="back" href="'+backHref+'">'+ic("back","s")+'Cancel</a><span class="ttl">'+title+'</span><span style="width:64px"></span></div>';
  if(step==="pick"){
    /* stands in for the phone's own picker (camera or library). The app never sees the library, only what the person picks. */
    var lib=["efr-c1","efr-c2","efr-c3","efr-1","sha-1","cur-1","len-1","rag-1","efr-2"];
    var n=picked().length,cap=room();
    h+='<div class="body">'+aim()+'<div class="mockmark">Your phone\'s own picker</div><div class="pad" style="padding-top:0"><div class="pgal">'+
      '<a class="addp" href="?'+qs({src:"cam",step:"edit",p:"efr-c2"})+'">'+ic("cam")+'Camera</a>'+
      lib.map(function(id){return '<button type="button" data-pk="'+id+'" aria-pressed="'+!!many[id]+'" aria-label="Photo">'+F.frame(id,"t",{alt:""})+(many[id]?'<span class="badge2">'+(picked().indexOf(id)+1)+'</span>':'')+'</button>'}).join("")+'</div>'+
      '<p style="font-size:12.5px;margin-top:10px">'+(kind==="dish"?"Pick one.":cap<3?onCook(cook)+" already from this cook, "+cap+" more fit.":"Pick up to 3 from this cook.")+'</p>'+
      (kind==="cooked"&&!replace?'<p style="margin-top:6px"><a class="back" style="font-size:13px" href="?'+qs({kind:"dish",step:"pick",p:""})+'">'+ic("img","s")+' Or a cover for '+esc(v.name)+'</a></p>':'')+
      (kind==="dish"&&!replace?'<p style="margin-top:6px"><a class="back" style="font-size:13px" href="?'+qs({kind:"cooked",step:"pick",p:""})+'">'+ic("cam","s")+' Or a photo of a cook</a></p>':'')+
      '</div></div>'+
      '<div class="act"><button type="button" class="btn" data-next'+(n?'':' disabled')+'>'+(n>1?'Add '+n+' photos':'Add')+'</button></div>';
  }else if(step==="edit"){
    var ps=picked();
    h+='<div class="body">'+aim()+
      (kind==="dish"?'<div class="frame sq">'+F.frame(ps[0],"m",{eager:1,alt:"The photo you picked"})+'<span class="crop" aria-hidden="true"></span></div><p class="pad" style="font-size:12.5px;padding-bottom:0">Drag to choose the square the list shows. The page shows the whole photo.</p>':
        (ps.length>1?'<div class="pad"><div class="pgal">'+ps.map(function(id){return '<span class="pt">'+F.frame(id,"t",{eager:1,alt:""})+'</span>'}).join("")+'</div></div>':'<div class="frame">'+F.frame(ps[0],"m",{eager:1,alt:"The photo you picked"})+'</div>'))+
      (askCook?'<div class="pad" style="padding-bottom:0"><span class="lbl">Which cook?</span></div><div class="strip" role="group" aria-label="Which cook" style="padding-bottom:4px">'+
        ["tonight"].concat(r.hist.slice(0,2).map(function(x){return x[0]})).map(function(c){return '<button type="button" data-cook="'+c+'" aria-pressed="'+(cook===c)+'">'+esc(cookLabel(c))+'</button>'}).join("")+'</div>'+
        (cook==="tonight"?'<p class="pad" style="font-size:12px;padding-top:4px;padding-bottom:0">No cook recorded today, so this adds one to Cooked (no pantry change).</p>':''):'')+
      (kind==="cooked"?'<div class="pad"><label class="lbl" for="ln">A line (optional)</label><input id="ln" class="field" style="margin-top:6px" placeholder="e.g. Used brown rice, fine."></div>':'')+
      '<div class="pad"><div class="shrink">'+ic("check","s")+'<span>Made smaller on your phone first: <b>4.2 MB → 190 KB</b>. Location removed.</span></div></div>'+
      '</div><div class="act"><button type="button" class="btn" data-up>'+ic("check","s")+(replace?'Use as cover':kind==="dish"?'Save cover':ps.length>1?'Save '+ps.length+' photos':'Save photo')+'</button></div>';
  }else{
    h+='<div class="body">'+aim()+'<div class="frame">'+F.frame(picked()[0],"m",{eager:1,alt:""})+'</div><div class="pad"><b id="upl">Sending…</b><div class="prog"><i id="bar"></i></div>'+
      '<p style="font-size:12.5px;margin-top:8px">You can leave this screen. If the signal drops it tries again; nothing is lost.</p></div></div>';
  }
  ph.innerHTML=h;F.load(ph);
  if(step==="up"){var w=0,b=document.getElementById("bar");var t=setInterval(function(){w+=22;b.style.width=Math.min(w,100)+"%";if(w>=100){clearInterval(t);location.href="done.html?"+qs({p:picked().join(","),step:null,src:null})}},F.state==="slow"?600:220)}
}
/* keep the current target in every link */
function qs(o){var u=new URLSearchParams({to:r.id,kind:kind});if(cook!=="tonight"||from==="cook")u.set("cook",cook);if(from)u.set("from",from);if(replace)u.set("replace",replace);
  for(var k in o){if(o[k]===null||o[k]==="")u.delete(k);else u.set(k,o[k])}return u.toString()}
ph.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.pk){var id=t.dataset.pk;if(many[id])delete many[id];else if(kind==="dish"){many={};many[id]=1}else if(picked().length<room())many[id]=1;else X.toast("Up to 3 from one cook");draw()}
  else if(t.hasAttribute("data-next")){step="edit";draw()}
  else if(t.dataset.cook){cook=t.dataset.cook;draw()}
  else if(t.hasAttribute("data-up")){step="up";draw()}
});
draw();
F.controls('<h4>Jump to</h4><p><a href="?to=efr&kind=cooked&from=cook">End of a cook: tonight</a> · <a href="?to=efr&kind=cooked&cook=29 Sep">From a Cooked row (29 Sep)</a> · <a href="?to=efr&kind=cooked">From the top camera (asks which cook)</a> · <a href="?to=efr&kind=cooked&src=cam&from=cook">After the camera</a> · <a href="?to=efr&kind=dish">Cover (secondary)</a> · <a href="?to=efr&src=cam&kind=dish&replace=efr-1&p=efr-c2">Replace the cover</a></p>');
})();
</script>
</body></html>
