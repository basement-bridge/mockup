<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cook it — Recipe tab mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="recipe.css"><script src="../theme.js"></script><script src="recipe.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
(function(){
var X=RCP,ic=X.ic,esc=X.esc,fmt=X.fmt;
var r=X.byId(X.Q.get("id")||"efr")||X.R[0];
var res=X.resolve(r,X.Q.get("v")),n=+(X.Q.get("n")||r.serves);
var mult=n;
var got={},step=-1,swapped={};
var ph=document.getElementById("ph");
function draw(){
  var head='<div class="top"><a class="back" href="detail.html?id='+r.id+'">'+ic("x","s")+'Stop</a><span class="ttl">'+esc(r.name)+'</span><span style="width:64px"></span></div>';
  if(step<0){
    /* R-D18: cook mode opens on the ingredients (cooking-right-now.md: ingredients lead). Tap to tick, long-press to say you used something else. */
    var m=X.missing(res.ings).length;
    ph.innerHTML=head+'<div class="body"><div class="pad"><p class="lbl" style="color:var(--accent)">Get it out · '+(r.batch?n+' portions':'serves '+n)+'</p>'+(m?'<p style="font-size:13px;margin-top:4px">'+m+' not in the pantry. Using something else tonight? Press and hold it.</p>':'')+'</div><div style="padding:0 12px">'+
      res.ings.map(function(x,k){var q=fmt(x.i[2],x.i[3],mult);var s=swapped[k];return '<button type="button" class="ck" role="checkbox" aria-checked="'+!!got[k]+'" data-k="'+k+'"><span class="amt">'+(q||"–")+'</span><span class="nm">'+esc(s||x.i[1])+(s?' <span class="was">(<s>'+esc(x.i[1])+'</s>)</span>':'')+(!X.has(x.i[0])&&!s?' <span class="tg miss">missing</span>':'')+'</span><span class="bx">'+(got[k]?ic("check","xs"):"")+'</span></button>'}).join("")+
      '</div><div style="height:24px"></div></div><div class="act"><button type="button" class="btn" data-next>Start the steps'+ic("chev","s")+'</button></div>';
  }else if(step<r.steps.length){
    var s=r.steps[step];
    ph.innerHTML=head+'<div class="body"><div class="bigstep"><span class="lbl">Step '+(step+1)+' of '+r.steps.length+'</span><p>'+esc(s[0])+'</p>'+(s[2]?'<button type="button" class="timer mini" style="min-height:44px;margin-top:12px">'+ic("clock","s")+'Start '+s[2]+' min timer</button>':'')+'</div>'+
      '<div class="pad"><button type="button" class="back" data-ings style="font-size:14px">'+ic("back","s")+' Ingredients</button></div></div>'+
      '<div class="act"><button type="button" class="btn ghost" data-prev>'+ic("back","s")+'Back</button><button type="button" class="btn" data-next>'+(step===r.steps.length-1?'Done':'Next')+ic("chev","s")+'</button></div>';
  }else{
    /* R-D19: the end asks once. What gets used from the pantry, and (only if something was swapped) whether to keep the change.
       Keeping it needs the person's own words; Recipe rejects a version without them (create_variation user_intent). */
    var sw=Object.keys(swapped);
    ph.innerHTML=head+'<div class="body"><div class="pad" style="text-align:center;padding-top:28px"><div style="font-size:52px">'+r.e+'</div><h2 style="margin-top:6px">Enjoy it</h2><p style="margin-top:4px">'+esc(res.v.name)+' · '+(r.batch?n+' portions':'serves '+n)+'</p></div>'+
      '<div class="pad"><div class="lblrow" style="margin-top:0"><span class="lbl">Take out of the pantry</span></div>'+
      res.ings.filter(function(x){return X.has(x.i[0])}).map(function(x){return '<div class="ing"><span class="dot" aria-hidden="true"></span><span class="nm">'+esc(x.i[1])+'<span class="q">'+(fmt(x.i[2],x.i[3],mult)||"some")+'</span></span></div>'}).join("")+
      (r.batch?'<div class="lblrow"><span class="lbl">Leftovers</span></div><button type="button" class="opt">'+ic("snow")+'<span class="t"><b>Put '+(n-2)+' portions in the freezer</b><small>Adds "'+esc(r.name)+'" to Pantry, Freezer</small></span></button>':'')+
      (sw.length?'<div class="note" style="margin-top:12px;border-color:var(--accent)">You used <b>'+sw.map(function(k){return esc(swapped[k])}).join(", ")+'</b> instead of '+sw.map(function(k){return esc(res.ings[k].i[1])}).join(", ")+'.<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button type="button" class="mini" data-just>Just tonight</button><button type="button" class="mini" data-keepv>Keep it as a version</button></div></div>':'')+
      '<div class="lblrow"><span class="lbl">Add to Cooked (optional)</span></div><div style="display:flex;gap:8px"><button type="button" class="btn ghost sm" style="flex:1">'+ic("cam","s")+'Photo</button><button type="button" class="btn ghost sm" style="flex:1">'+ic("note","s")+'A line</button></div>'+
      '</div><div style="height:24px"></div></div><div class="act"><a class="btn" href="detail.html?id='+r.id+'">'+ic("check","s")+'Done, update the pantry</a></div>';
  }
}
var hold=null;
ph.addEventListener("pointerdown",function(e){var b=e.target.closest("[data-k]");if(!b)return;hold=setTimeout(function(){hold="fired";var k=+b.dataset.k;X.sheet('<h3>Used something else?</h3><p style="font-size:13px">For tonight only. You will be asked at the end whether to keep it.</p><input class="field" id="sw" style="margin-top:10px" placeholder="e.g. Shallots" value="'+(res.ings[k].i[0]==="spring"?"Chives":"")+'"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-close>Cancel</button><button class="btn" data-ok>Use it</button></div>',function(s,close){s.querySelector("[data-ok]").onclick=function(){var v=s.querySelector("#sw").value.trim();if(v)swapped[k]=v;got[k]=1;close();draw()}})},500)});
["pointerup","pointerleave","pointercancel"].forEach(function(n){ph.addEventListener(n,function(){if(hold&&hold!=="fired")clearTimeout(hold)})});
ph.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.k!=null){if(hold==="fired"){hold=null;return}var k=+t.dataset.k;got[k]=!got[k];draw()}
  else if(t.hasAttribute("data-next")){step++;draw();ph.querySelector(".body").scrollTop=0}
  else if(t.hasAttribute("data-prev")){step--;draw()}
  else if(t.hasAttribute("data-ings")){step=-1;draw()}
  else if(t.hasAttribute("data-just")){t.closest(".note").innerHTML="Kept for tonight only. The recipe is unchanged."}
  else if(t.hasAttribute("data-keepv")){var note=t.closest(".note");X.sheet('<h3>Keep it as a version</h3><label class="lbl" for="w">In your words, why keep it?</label><input class="field" id="w" style="margin-top:4px" value="That worked well, save it"><p style="font-size:12px;margin-top:6px">Saved as your words. Recipe will not keep a version without them.</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-close>Back</button><button class="btn" data-ok>Keep it</button></div>',function(s,close){s.querySelector("[data-ok]").onclick=function(){close();note.innerHTML="Saved as a new version. It shows on the recipe under Versions."}})}
});
draw();
X.controls();
})();
</script>
</body></html>
