<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Add a recipe — Recipe tab mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="recipe.css"><link rel="stylesheet" href="flow2.css"><script src="../theme.js"></script><script src="recipe.js"></script><script src="flow2.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
/* Add a recipe. Owner decision L4 (voice, 10 October 2026): recipes are STARTED only through the person's own AI assistant, over Recipe's MCP tools.
   No paste box, no link, no reading a photo, no "one box / four doors" (R-D13 options A and B are void). (11 Oct 2026: editing a recipe by hand is allowed after it exists, see edit.html; only creating stays assistant-only.) This screen only explains how, and
   points at any draft already waiting. The app's own jobs are adding photos (especially after cooking) and notes, on the recipe and at the end of a cook.
   Performance: no form, no reader, no upload code; the page is text and two links. */
(function(){
var X=RCP,ic=X.ic,esc=X.esc;
var ph=document.getElementById("ph");
var say="Add a recipe to Kitchie: egg fried rice for 2. 3 eggs, 300 g cold rice, an onion, soy sauce. Fry the onion, scramble the eggs, add the rice and soy.";
var waiting=X.DRAFTS;
ph.innerHTML='<div class="top"><a class="back" href="list.html">'+ic("back","s")+'Recipes</a><span class="ttl">Add a recipe</span><span style="width:64px"></span></div>'+
  '<div class="body">'+
  '<div class="add-hero"><span class="e" aria-hidden="true">✨</span><div><h2>Your assistant adds recipes</h2><p style="margin-top:2px">Recipes come in through your own AI app. You check them here before they count.</p></div></div>'+
  '<ol class="how">'+
    '<li><span class="n">'+ic("spark")+'</span><span><b>Open your AI app</b><p>The assistant you already use, connected to your household.</p></span></li>'+
    '<li><span class="n">'+ic("note")+'</span><span><b>Ask it to add a recipe</b><p>Tell it the recipe in your own words, or the one you are cooking from. Partial is fine: it leaves blanks blank.</p></span></li>'+
    '<li><span class="n">'+ic("check")+'</span><span><b>It arrives as Suggested</b><p>The draft waits at the top of Recipes. Open it on Check it, fix anything, then save. If it looks like one you have, you are told and nothing is merged.</p></span></li>'+
  '</ol>'+
  '<div class="say"><small>You could say</small>'+esc(say)+'</div>'+
  '<div class="pad"><button type="button" class="mini" data-copy>'+ic("note","xs")+'Copy that</button></div>'+
  (waiting.length?'<div class="lblrow pad" style="padding-top:0;padding-bottom:0"><span class="lbl">Waiting for you · '+waiting.length+'</span></div>'+
    waiting.map(function(d){return '<a class="slim acc" href="review.html?from=assistant"><span class="e" aria-hidden="true">'+d.e+'</span><span class="t"><b>'+esc(d.name)+'</b><small>Suggested · '+esc(d.from)+'</small></span><span class="chev">'+ic("chev","s")+'</span></a>'}).join(""):'')+
  '<div class="pad" style="margin-top:var(--sp-3)"><p style="font-size:13px">'+ic("cam","xs")+' <b style="color:var(--fg)">Once it is in, it is yours to edit by hand:</b> name, ingredients, steps, notes, tags and photos (owner, 11 Oct 2026). Open any recipe and tap the pencil. Photos of what you made and notes are added there, or at the end of a cook.</p></div>'+
  '<div style="height:24px"></div></div>';
ph.addEventListener("click",function(e){
  if(e.target.closest("[data-copy]")){try{navigator.clipboard&&navigator.clipboard.writeText(say)}catch(err){}X.toast("Copied. Paste it into your AI app.")}
});
X.controls('<h4>Add (L4, locked)</h4><p>One screen: the assistant adds recipes. <a href="review.html?from=assistant">Check an assistant draft</a> · <a href="review.html?from=dup">Duplicate found</a></p>');
})();
</script>
</body></html>
