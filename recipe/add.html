<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Add a recipe — Recipe tab mockup</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="recipe.css"><script src="../theme.js"></script><script src="recipe.js"></script></head>
<body data-no-theme-fab>
<div class="stage"><div class="phone" id="ph"></div></div>
<script>
(function(){
var X=RCP,ic=X.ic;
var opt=X.Q.get("add")||X.store.get("add","A");X.store.set("add",opt);
var ph=document.getElementById("ph");
var top='<div class="top"><a class="back" href="list.html">'+ic("back","s")+'Recipes</a><span class="ttl">Add a recipe</span><span style="width:64px"></span></div>';
var aiTile='<a class="tile ai" href="review.html?from=assistant">'+ic("spark")+'<b>Ask your assistant</b><small>Opens your AI app. What it writes comes back here as a draft for you to check.</small></a>';
var A=top+'<div class="body">'+
  /* R-D13 option A: one box takes anything. Paste a recipe, a link, or type it in your own words; the reader sorts out which. */
  '<div class="drop"><label class="vh" for="t">Paste or type a recipe</label><textarea id="t" placeholder="Paste a recipe or a link, or type it the way you would tell a friend.\n\ne.g. Egg fried rice for 2. 3 eggs, 300 g cold rice, an onion, soy sauce…"></textarea>'+
  '<div class="row"><button type="button" class="ib" aria-label="Dictate">'+ic("mic","s")+'</button><button type="button" class="ib" aria-label="Take or choose a photo" data-photo>'+ic("cam","s")+'</button><span style="flex:1"></span><a class="btn sm" href="review.html?from=paste" id="go">Read it</a></div></div>'+
  '<p class="pad" style="font-size:13px">Photos of a card, a book page or a screen work too: one recipe per photo, several photos if it runs over a page.</p>'+
  '<div class="lblrow pad" style="padding-top:0;padding-bottom:0;margin-top:0"><span class="lbl">Or</span></div>'+
  '<div class="tiles" style="grid-template-columns:1fr">'+aiTile+'</div>'+
  '</div>';
var B=top+'<div class="body">'+
  /* R-D13 option B: four doors, one per way in. Clearer, one more tap. */
  '<div class="tiles">'+
  '<a class="tile" href="review.html?from=paste">'+ic("type")+'<b>Type or paste</b><small>A recipe in your own words, or copied from anywhere</small></a>'+
  '<a class="tile" href="review.html?from=photo">'+ic("cam")+'<b>Photo</b><small>A card, a book page, a screenshot</small></a>'+
  '<a class="tile" href="review.html?from=link">'+ic("link")+'<b>Link</b><small>A recipe web page</small></a>'+
  aiTile.replace('tile ai','tile ai')+
  '</div></div>';
ph.innerHTML=(opt==="B"?B:A);
ph.addEventListener("click",function(e){if(e.target.closest("[data-photo]"))X.sheet('<h3>Photo of a recipe</h3><button class="opt">'+ic("cam")+'<span class="t"><b>Take a photo</b><small>Hold it flat. Add the back of a card as a second photo.</small></span></button><a class="opt" href="review.html?from=photo">'+ic("img")+'<span class="t"><b>Choose from photos</b><small>Sample: a handwritten card</small></span></a>')});
X.controls('<h4>Add screen, option</h4><div class="seg"><button type="button" data-addopt="A" aria-pressed="'+(opt==="A")+'">A One box</button><button type="button" data-addopt="B" aria-pressed="'+(opt==="B")+'">B Four doors</button></div>');
document.addEventListener("click",function(e){var b=e.target.closest("[data-addopt]");if(b){X.store.set("add",b.dataset.addopt);location.href="add.html"}});
})();
</script>
</body></html>
