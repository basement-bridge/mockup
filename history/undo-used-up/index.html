<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>History: Undo a Used up</title>
<link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="../../shared.css"><link rel="stylesheet" href="../option-d/option-d.css"><link rel="stylesheet" href="../search/search.css"><link rel="stylesheet" href="undo.css">
<script src="../../theme.js"></script></head>
<body data-no-theme-fab>
<!-- kitchie #1102: undo a Used up from History. Phone first. Spec: docs/knowledge/history-undo.md.
 Same row markup as history/search (.ev.dv, avatar, .tx, .meta.hds, time). The Undo is one pill in the meta row, so the row stays one tap target and the avatar and line are unchanged.
 Parameters: ?mode=redo-word (the Undid step says Undo instead of Redo, the open copy choice) &state=gone (an Undo or Redo has just been pressed) -->
<div class="hx" id="hx">
 <main class="hx-main">
  <div class="hx-head"><h1>History</h1></div>
  <section class="day"><div class="lbl">Today</div>
   <div class="pg" id="list">
    <!-- 1 newest step of its item: Undo -->
    <div class="ev dv" data-seq="412" data-kind="undo"><span class="avb"><span class="av me sm" aria-hidden="true">A</span></span>
     <div class="tx"><button type="button" class="evo"><span class="ln"><b class="wh">You</b> used up <b>yogurt, greek yoguri</b></span></button>
      <div class="meta hds"><button type="button" class="hd act" data-act aria-label="Undo: used up yogurt, greek yoguri"><svg class="sm" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span>Undo</span></button></div></div>
     <time datetime="2026-10-25T09:12">9:12</time></div>
    <!-- 2 item changed since: nothing -->
    <div class="ev dv" data-seq="409"><span class="avb"><span class="av sm" aria-hidden="true">S</span></span>
     <div class="tx"><button type="button" class="evo"><span class="ln"><b class="wh">Sam</b> used up <b>cottage cheese, high protein westacre</b></span></button></div>
     <time datetime="2026-10-25T08:40">8:40</time></div>
    <!-- 3 already undone: Undone chip, no button -->
    <div class="ev dv is-undone" data-seq="405"><span class="avb"><span class="av me sm" aria-hidden="true">A</span></span>
     <div class="tx"><button type="button" class="evo"><span class="ln"><b class="wh">You</b> used up <b>oats</b></span></button>
      <div class="meta hds"><span class="chip undone"><svg class="sm" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Undone</span></div></div>
     <time datetime="2026-10-25T07:55">7:55</time></div>
    <!-- 4 the undo step itself, newest: Redo -->
    <div class="ev dv" data-seq="406" data-kind="redo"><span class="avb"><span class="av me sm" aria-hidden="true">A</span></span>
     <div class="tx"><button type="button" class="evo"><span class="ln"><b class="wh">You</b> put back <b>oats</b></span></button>
      <div class="meta hds"><button type="button" class="hd act" data-act aria-label="Redo: used up oats"><svg class="sm" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg><span data-word>Redo</span></button></div></div>
     <time datetime="2026-10-25T07:56">7:56</time></div>
    <!-- 5 any other undoable step: same control -->
    <div class="ev dv" data-seq="401" data-kind="undo"><span class="avb"><span class="av sm" aria-hidden="true">S</span></span>
     <div class="tx"><button type="button" class="evo"><span class="ln"><b class="wh">Sam</b> used one <b>milk</b>, 3 to 2</span></button>
      <div class="meta hds"><button type="button" class="hd act" data-act aria-label="Undo: used one milk"><svg class="sm" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span>Undo</span></button></div></div>
     <time datetime="2026-10-25T07:10">7:10</time></div>
   </div>
  </section>
  <p class="note capline">Last 50 steps</p>
 </main>
 <div id="toast" class="toast ubar" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Undo</button></div>
</div>
<script src="undo.js"></script>
</body></html>
