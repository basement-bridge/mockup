<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>History in context: desktop</title>
<link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="../../shared.css"><link rel="stylesheet" href="hc.css">
<style>
body{height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:88px 1fr;height:100vh}
.rail{border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding-top:var(--sp-5);color:var(--muted)}
.rail span{width:44px;height:44px;border-radius:var(--r-ctl);display:grid;place-items:center;border:1px solid transparent}.rail .on{border-color:var(--accent);color:var(--accent)}
.col{display:flex;flex-direction:column;min-width:0;height:100vh}
.scnbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:var(--sp-2) var(--sp-5);border-bottom:1px dashed var(--border);font-size:12px;color:var(--muted)}
.scnbar button{min-height:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);color:var(--fg);font:600 13px var(--body);cursor:pointer}
.scnbar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scnbar .st{border-style:dashed}
.stage{flex:1;min-height:0;display:flex;gap:var(--sp-5);padding:var(--sp-5)}
.hostc{width:400px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--sp-5);align-self:flex-start}
.hostc .top{display:flex;gap:var(--sp-3);align-items:center}
.hostc .em{font-size:34px;width:64px;height:64px;display:grid;place-items:center;border-radius:var(--r-card);background:var(--bg);border:1px solid var(--border)}
.hostc h1{font-size:1.5rem;margin:0}.hostc p{font-size:13px}
.hostc .ic{margin-left:auto;display:flex;gap:6px}
.hostc .ic button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;position:relative}
.hostc .ic button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.hostc .ic .kbd{position:absolute;right:-4px;bottom:-6px;background:var(--surface)}
.hostc ul{list-style:none;margin:var(--sp-4) 0 0;padding:0}.hostc li{padding:10px 0;border-top:1px solid var(--border);font-size:14px}.hostc li.sel{font-weight:700;color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.pane{flex:1;min-width:0;max-width:460px;height:calc(100vh - 124px)}
.closed{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-2);color:var(--muted);font-size:14px}
@media(max-width:1239px){.hostc{width:320px}.stage{gap:var(--sp-4);padding:var(--sp-4)}}
</style>
<script src="../../theme.js"></script></head><body data-no-theme-fab>
<div class="app"><nav class="rail" aria-label="Mockup rail"><span>H</span><span>P</span><span>R</span><span class="on">S</span></nav>
<div class="col"><div class="scnbar" id="bar"><b>Mockup controls:</b></div>
<div class="stage"><div class="hostc" id="host"></div><div class="pane" id="pane"></div></div></div></div>
<script src="hc.js"></script><script src="scn.js"></script>
<script>
(function(){
var p=new URLSearchParams(location.search),cur=p.get("scope")||"shop:rice",st0=p.get("state")||"",inst,openP=true,pane=document.getElementById("pane"),box=document.createElement("div"),hk="shop";box.style.height="100%";pane.appendChild(box);
function hostKey(s){var t=HC.parse(s);return t.t==="shop"&&t.id==="tea"?"tea":t.t==="shop"?"shop":t.t}
function host(k){hk=k;var h=HOST[k]||HOST.shop,cu=k==="catchup";
 document.getElementById("host").innerHTML='<div class="top"><span class="em" aria-hidden="true">'+h[0]+'</span><div><h1>'+HC.esc(h[1])+'</h1><p>'+HC.esc(h[2])+'</p></div>'+(cu?"":'<div class="ic"><button type="button" id="hb" aria-label="History" aria-pressed="'+openP+'">'+HC.ic("clock",20)+HC.kbd(",")+'</button></div>')+'</div><ul>'+h[3].map(function(x,i){return"<li"+(cu&&i===(CATCH_ROW[HC.parse(cur).t]||0)?' class="sel"':"")+">"+HC.esc(x)+"</li>"}).join("")+"</ul>";
 var b=document.getElementById("hb");if(b)b.onclick=toggle}
function mark(s,q){[].forEach.call(document.querySelectorAll("#bar button"),function(b){b.setAttribute("aria-pressed",b.dataset.s===s&&(b.dataset.q||"")===(q||""))})}
function build(s,state){cur=s;openP=true;var cu=state==="catchup";host(cu?"catchup":hostKey(s));box.innerHTML="";
 inst=HC.create(box,{mode:"desktop",scope:s,from:cu?"catchup":"",focus:cu?(SCN_FOCUS[s]||""):"",onClose:close,onBack:function(){close(true)},onScope:function(e){cur=e.t+":"+e.id;host(hostKey(cur));mark("","")}});
 if(state==="nomatch")inst.setFilter({who:"sam",what:"buy"});mark(s,state)}
function close(back){openP=false;inst.setOpen(false);if(back===true)host("catchup");box.innerHTML='<div class="closed"><b style="font-family:var(--head);color:var(--fg)">History is closed</b><span>'+(back===true?"Back in the catch-up. Pick a scenario to open it again.":"Press "+HC.kbd(",")+" to open it for "+HC.esc(document.querySelector("#host h1").textContent)+".")+'</span></div>';var b=document.getElementById("hb");if(b)b.setAttribute("aria-pressed","false")}
function reopen(){openP=true;inst.setOpen(true);inst.repaint();var b=document.getElementById("hb");if(b)b.setAttribute("aria-pressed","true")}
function toggle(){openP?close():reopen()}
document.addEventListener("keydown",function(e){if(e.key===","&&!e.ctrlKey&&!e.metaKey&&hk!=="catchup"&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();toggle()}});
var bar=document.getElementById("bar");
SCN.forEach(function(x){var b=document.createElement("button");b.type="button";b.dataset.s=x[0];b.textContent=x[1];b.title=x[2];b.onclick=function(){build(x[0],"")};bar.appendChild(b)});
SCN_STATES.forEach(function(x){var b=document.createElement("button");b.type="button";b.className="st";b.dataset.s=x[0];b.dataset.q=x[1];b.textContent=x[2];b.onclick=function(){build(x[0],x[1])};bar.appendChild(b)});
build(cur,st0);
if(p.get("widen")!=null)inst.widenTo(+p.get("widen"));
if(p.get("filters"))inst.setFilt(true);
})();
</script></body></html>
