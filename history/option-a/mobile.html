<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>History search, phone — Option A</title>
<link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="history.css"><script src="../../theme.js"></script></head>
<body data-no-theme-fab>
<!-- Phone, Option A "Search first". ?state=entry|start|results|zero|loading|empty  &q=phrase  &sel=e1 (detail sheet open)
     Default path: this page, history.css, history.js (about 30 KB together). The event list is NOT fetched until the person types or taps
     a suggestion; the start screen is recents + suggestions only (no request). Deferred: the sample here is in-script; the build fetches one page of 30 entries
     per search, then 30 more on scroll. -->
<div class="hm-stage"><main class="hm-phone" id="ph"></main></div>
<script src="history.js"></script>
<script>
(function(){
var H=window.HS,Q=new URLSearchParams(location.search),st=Q.get("state")||(Q.get("q")?"results":"start"),ph=document.getElementById("ph"),M;
function entry(){ph.innerHTML='<div class="hm-head"><h1 style="font-family:var(--head);font-size:1.5rem;margin:6px 4px">Settings</h1></div><div class="hm-body"><ul class="hm-set"><li><button type="button">'+H.ic("gear")+'Preferences'+H.ic("chev")+'</button></li><li><a href="mobile.html?state=start" id="go">'+H.ic("clock")+'History'+'<small class="hs-m" style="margin-left:auto">Search what happened</small>'+H.ic("chev")+'</a></li><li><button type="button">'+H.ic("list")+'Household'+H.ic("chev")+'</button></li></ul><p class="hs-m" style="margin:14px 4px">Proposal: the Settings History row opens the search directly. Same screen opens from a magnifier on Home.</p></div>'}
function sheet(e){var s=ph.querySelector(".hm-sheet"),d=ph.querySelector(".hm-sheet-dim");if(!e){s&&s.remove();d&&d.remove();return}
 if(!s){d=document.createElement("div");d.className="hm-sheet-dim";s=document.createElement("div");s.className="hm-sheet";s.setAttribute("role","dialog");s.setAttribute("aria-label","Entry details");ph.appendChild(d);ph.appendChild(s);d.onclick=function(){sheet(null)}}
 s.innerHTML='<div class="hm-grab"></div><button type="button" class="hs-x" aria-label="Close" style="position:absolute;right:8px;top:8px">'+H.ic("x")+'</button>'+H.detail(e);
 s.querySelector(".hs-x").onclick=function(){sheet(null)};
 s.onclick=function(ev){var b=ev.target.closest("button");if(!b)return;if(b.dataset.undo){M.undo(b.dataset.undo);sheet(null)}else if(b.dataset.add){sheet(null);ph.querySelector(".hs").click();}}}
if(st==="entry"){entry();return}
ph.innerHTML='<div class="hs" id="hs"></div>';
M=H.mount(document.getElementById("hs"),{back:"mobile.html?state=entry",q:Q.get("q")||"",state:(st==="loading"||st==="empty")?st:"",sel:Q.get("sel"),focus:st==="start",
 onOpen:function(e){sheet(e)}});
/* tapping a value in the sheet adds it as a chip: handled by the surface's own click handler, since the sheet is inside #ph */
document.getElementById("hs").addEventListener("click",function(){});
ph.addEventListener("click",function(ev){var b=ev.target.closest(".hm-sheet [data-add]");if(!b)return;var k=b.dataset.add,v=b.dataset.val;M.S.f[k==="sub"?"sub":k]=v;M.S.state="";sheet(null);M.draw(false)});
if(Q.get("sel")){var e=H.E.filter(function(x){return x.id===Q.get("sel")})[0];if(e)sheet(e)}
})();
</script></body></html>
